version: '3.8'

services:
  backend:
    build:
      context: ./na-ni-tickets/backend
      dockerfile: Dockerfile
    container_name: nani-tickets-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - PORT=5000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=NA-NI TICKETS
      - FRONTEND_URL=${FRONTEND_URL}
      - OTP_EXPIRY=10
    restart: unless-stopped

  frontend:
    build:
      context: ./na-ni-tickets/frontend
      dockerfile: Dockerfile
    container_name: nani-tickets-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_STRIPE_PUBLIC_KEY=${REACT_APP_STRIPE_PUBLIC_KEY}
    restart: unless-stopped
    restart: unless-stopped

volumes:
  mongodb_data:
